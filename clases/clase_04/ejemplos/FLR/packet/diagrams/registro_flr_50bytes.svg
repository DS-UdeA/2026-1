
<svg width="100%" viewBox="0 0 680 320">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Title -->
<text class="th" x="340" y="28" text-anchor="middle">Registro de longitud fija — 50 bytes</text>

<!-- Field blocks row 1: ID(5), LastName(15), FirstName(15), Age(5), Salary(10) -->
<!-- Total width: 600px, proportional to bytes. Scale: 12px per byte -->
<!-- ID: 5*12=60, LastName: 15*12=180, FirstName: 15*12=180, Age: 5*12=60, Salary: 10*12=120 -->
<!-- Start x=40 -->

<!-- ID field -->
<g class="c-teal">
  <rect x="40" y="50" width="60" height="60" rx="4" stroke-width="0.5"/>
  <text class="th" x="70" y="74" text-anchor="middle" dominant-baseline="central">ID</text>
  <text class="ts" x="70" y="94" text-anchor="middle" dominant-baseline="central">5 bytes</text>
</g>

<!-- Last Name field -->
<g class="c-purple">
  <rect x="100" y="50" width="180" height="60" rx="4" stroke-width="0.5"/>
  <text class="th" x="190" y="74" text-anchor="middle" dominant-baseline="central">Last Name</text>
  <text class="ts" x="190" y="94" text-anchor="middle" dominant-baseline="central">15 bytes</text>
</g>

<!-- First Name field -->
<g class="c-coral">
  <rect x="280" y="50" width="180" height="60" rx="4" stroke-width="0.5"/>
  <text class="th" x="370" y="74" text-anchor="middle" dominant-baseline="central">First Name</text>
  <text class="ts" x="370" y="94" text-anchor="middle" dominant-baseline="central">15 bytes</text>
</g>

<!-- Age field -->
<g class="c-amber">
  <rect x="460" y="50" width="60" height="60" rx="4" stroke-width="0.5"/>
  <text class="th" x="490" y="74" text-anchor="middle" dominant-baseline="central">Age</text>
  <text class="ts" x="490" y="94" text-anchor="middle" dominant-baseline="central">5 bytes</text>
</g>

<!-- Salary field -->
<g class="c-blue">
  <rect x="520" y="50" width="120" height="60" rx="4" stroke-width="0.5"/>
  <text class="th" x="580" y="74" text-anchor="middle" dominant-baseline="central">Salary</text>
  <text class="ts" x="580" y="94" text-anchor="middle" dominant-baseline="central">10 bytes</text>
</g>

<!-- Byte offset labels below fields -->
<text class="ts" x="40" y="128" text-anchor="middle" dominant-baseline="central">0</text>
<text class="ts" x="100" y="128" text-anchor="middle" dominant-baseline="central">5</text>
<text class="ts" x="280" y="128" text-anchor="middle" dominant-baseline="central">20</text>
<text class="ts" x="460" y="128" text-anchor="middle" dominant-baseline="central">35</text>
<text class="ts" x="520" y="128" text-anchor="middle" dominant-baseline="central">40</text>
<text class="ts" x="640" y="128" text-anchor="middle" dominant-baseline="central">50</text>

<!-- Tick marks at offsets -->
<line x1="40"  y1="115" x2="40"  y2="122" stroke="var(--color-text-secondary)" stroke-width="0.5"/>
<line x1="100" y1="115" x2="100" y2="122" stroke="var(--color-text-secondary)" stroke-width="0.5"/>
<line x1="280" y1="115" x2="280" y2="122" stroke="var(--color-text-secondary)" stroke-width="0.5"/>
<line x1="460" y1="115" x2="460" y2="122" stroke="var(--color-text-secondary)" stroke-width="0.5"/>
<line x1="520" y1="115" x2="520" y2="122" stroke="var(--color-text-secondary)" stroke-width="0.5"/>
<line x1="640" y1="115" x2="640" y2="122" stroke="var(--color-text-secondary)" stroke-width="0.5"/>

<!-- Baseline ruler -->
<line x1="40" y1="118" x2="640" y2="118" stroke="var(--color-text-secondary)" stroke-width="0.5"/>

<!-- Example data row -->
<text class="ts" x="40" y="155" dominant-baseline="central">Ejemplo:</text>
<g class="c-gray">
  <rect x="40" y="166" width="60" height="36" rx="4" stroke-width="0.5"/>
  <text class="ts" x="70" y="184" text-anchor="middle" dominant-baseline="central">123</text>
</g>
<g class="c-gray">
  <rect x="100" y="166" width="180" height="36" rx="4" stroke-width="0.5"/>
  <text class="ts" x="190" y="184" text-anchor="middle" dominant-baseline="central">Simpson·········</text>
</g>
<g class="c-gray">
  <rect x="280" y="166" width="180" height="36" rx="4" stroke-width="0.5"/>
  <text class="ts" x="370" y="184" text-anchor="middle" dominant-baseline="central">Homer··········</text>
</g>
<g class="c-gray">
  <rect x="460" y="166" width="60" height="36" rx="4" stroke-width="0.5"/>
  <text class="ts" x="490" y="184" text-anchor="middle" dominant-baseline="central">31···</text>
</g>
<g class="c-gray">
  <rect x="520" y="166" width="120" height="36" rx="4" stroke-width="0.5"/>
  <text class="ts" x="580" y="184" text-anchor="middle" dominant-baseline="central">400·······</text>
</g>

<!-- Formula -->
<text class="ts" x="340" y="232" text-anchor="middle" dominant-baseline="central">Acceso directo O(1): offset = índice × 50</text>
<text class="ts" x="340" y="256" text-anchor="middle" dominant-baseline="central">Registro 2 (Ned Flanders) → offset = 2 × 50 = 100</text>

<!-- Arrow pointing to byte 100 -->
<line x1="340" y1="268" x2="160" y2="290" class="arr" marker-end="url(#arrow)" stroke="var(--color-text-secondary)"/>
<text class="ts" x="130" y="305" text-anchor="middle" dominant-baseline="central">byte 100</text>

</svg>
