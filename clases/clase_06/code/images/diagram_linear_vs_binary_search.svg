<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">

  <!-- Background -->
  <rect width="760" height="400" fill="#f8f9fa" rx="12"/>

  <!-- Title -->
  <text x="380" y="38" text-anchor="middle" font-size="17" font-weight="700" fill="#1a3a2a">Búsqueda Lineal vs Búsqueda Binaria — sobre un índice de 12 entradas</text>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- LEFT PANEL: Linear Search -->
  <!-- ══════════════════════════════════════════════════════════ -->
  <rect x="20" y="58" width="345" height="320" fill="#fff" rx="10" stroke="#dde3e0" stroke-width="1.5"/>
  <rect x="20" y="58" width="345" height="38" fill="#6b2d8b" rx="10"/>
  <rect x="20" y="82" width="345" height="14" fill="#6b2d8b"/>
  <text x="192" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Búsqueda Lineal — O(n)</text>

  <!-- Index entries — left panel -->
  <!-- Each row: key + block, colored progressively as scanned -->
  <g transform="translate(40, 108)">
    <!-- Headers -->
    <text x="60"  y="0" text-anchor="middle" font-size="11" fill="#888" font-weight="600">Search Key</text>
    <text x="140" y="0" text-anchor="middle" font-size="11" fill="#888" font-weight="600">Block #</text>
    <text x="220" y="0" text-anchor="middle" font-size="11" fill="#888" font-weight="600">Estado</text>

    <!-- Rows — highlighted ones are "scanned" -->
    <!-- row height = 20, start y = 14 -->
    <!-- Keys: 10101 0, 12121 0, 15151 0, 22222 0, 32343 0, 33456 1, 45565 1 (TARGET), ... -->

    <!-- row 0 — scanned -->
    <rect x="20" y="16" width="265" height="18" fill="#ede6f5" rx="3"/>
    <text x="60"  y="29" text-anchor="middle" font-size="11" fill="#6b2d8b" font-weight="600">10101</text>
    <text x="140" y="29" text-anchor="middle" font-size="11" fill="#6b2d8b">0</text>
    <text x="225" y="29" text-anchor="middle" font-size="10" fill="#6b2d8b">✓ comparado</text>

    <!-- row 1 -->
    <rect x="20" y="36" width="265" height="18" fill="#ede6f5" rx="3"/>
    <text x="60"  y="49" text-anchor="middle" font-size="11" fill="#6b2d8b" font-weight="600">12121</text>
    <text x="140" y="49" text-anchor="middle" font-size="11" fill="#6b2d8b">0</text>
    <text x="225" y="49" text-anchor="middle" font-size="10" fill="#6b2d8b">✓ comparado</text>

    <!-- row 2 -->
    <rect x="20" y="56" width="265" height="18" fill="#ede6f5" rx="3"/>
    <text x="60"  y="69" text-anchor="middle" font-size="11" fill="#6b2d8b" font-weight="600">15151</text>
    <text x="140" y="69" text-anchor="middle" font-size="11" fill="#6b2d8b">0</text>
    <text x="225" y="69" text-anchor="middle" font-size="10" fill="#6b2d8b">✓ comparado</text>

    <!-- row 3 -->
    <rect x="20" y="76" width="265" height="18" fill="#ede6f5" rx="3"/>
    <text x="60"  y="89" text-anchor="middle" font-size="11" fill="#6b2d8b" font-weight="600">22222</text>
    <text x="140" y="89" text-anchor="middle" font-size="11" fill="#6b2d8b">0</text>
    <text x="225" y="89" text-anchor="middle" font-size="10" fill="#6b2d8b">✓ comparado</text>

    <!-- row 4 -->
    <rect x="20" y="96" width="265" height="18" fill="#ede6f5" rx="3"/>
    <text x="60"  y="109" text-anchor="middle" font-size="11" fill="#6b2d8b" font-weight="600">32343</text>
    <text x="140" y="109" text-anchor="middle" font-size="11" fill="#6b2d8b">0</text>
    <text x="225" y="109" text-anchor="middle" font-size="10" fill="#6b2d8b">✓ comparado</text>

    <!-- row 5 -->
    <rect x="20" y="116" width="265" height="18" fill="#ede6f5" rx="3"/>
    <text x="60"  y="129" text-anchor="middle" font-size="11" fill="#6b2d8b" font-weight="600">33456</text>
    <text x="140" y="129" text-anchor="middle" font-size="11" fill="#6b2d8b">1</text>
    <text x="225" y="129" text-anchor="middle" font-size="10" fill="#6b2d8b">✓ comparado</text>

    <!-- row 6 — TARGET FOUND -->
    <rect x="20" y="136" width="265" height="18" fill="#1a5c3a" rx="3"/>
    <text x="60"  y="149" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">45565</text>
    <text x="140" y="149" text-anchor="middle" font-size="11" fill="#fff">1</text>
    <text x="225" y="149" text-anchor="middle" font-size="10" fill="#7ab648" font-weight="700">★ ENCONTRADO</text>

    <!-- rows 7-11 — not scanned, greyed -->
    <g opacity="0.35">
      <rect x="20" y="156" width="265" height="18" fill="#eee" rx="3"/>
      <text x="60"  y="169" text-anchor="middle" font-size="11" fill="#aaa">58583</text>
      <text x="140" y="169" text-anchor="middle" font-size="11" fill="#aaa">1</text>

      <rect x="20" y="176" width="265" height="18" fill="#eee" rx="3"/>
      <text x="60"  y="189" text-anchor="middle" font-size="11" fill="#aaa">76543</text>
      <text x="140" y="189" text-anchor="middle" font-size="11" fill="#aaa">1</text>

      <rect x="20" y="196" width="265" height="18" fill="#eee" rx="3"/>
      <text x="60"  y="209" text-anchor="middle" font-size="11" fill="#aaa">76766</text>
      <text x="140" y="209" text-anchor="middle" font-size="11" fill="#aaa">1</text>

      <rect x="20" y="216" width="265" height="18" fill="#eee" rx="3"/>
      <text x="60"  y="229" text-anchor="middle" font-size="11" fill="#aaa">83821</text>
      <text x="140" y="229" text-anchor="middle" font-size="11" fill="#aaa">2</text>

      <rect x="20" y="236" width="265" height="18" fill="#eee" rx="3"/>
      <text x="60"  y="249" text-anchor="middle" font-size="11" fill="#aaa">98345</text>
      <text x="140" y="249" text-anchor="middle" font-size="11" fill="#aaa">2</text>
    </g>

    <!-- Cost label -->
    <rect x="20" y="264" width="265" height="26" fill="#f3ecfa" rx="5" stroke="#6b2d8b" stroke-width="1"/>
    <text x="152" y="281" text-anchor="middle" font-size="12" fill="#6b2d8b" font-weight="700">7 comparaciones para encontrar ID=45565</text>
  </g>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- RIGHT PANEL: Binary Search -->
  <!-- ══════════════════════════════════════════════════════════ -->
  <rect x="395" y="58" width="345" height="320" fill="#fff" rx="10" stroke="#dde3e0" stroke-width="1.5"/>
  <rect x="395" y="58" width="345" height="38" fill="#1a5c3a" rx="10"/>
  <rect x="395" y="82" width="345" height="14" fill="#1a5c3a"/>
  <text x="567" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Búsqueda Binaria — O(log₂ n)</text>

  <!-- Steps -->
  <g transform="translate(415, 108)">

    <!-- Step labels -->
    <text x="152" y="10" text-anchor="middle" font-size="11" fill="#888" font-weight="600">Paso 1 — mitad = posición 6</text>

    <!-- All 12 rows, highlight only step positions -->
    <!-- Step 1: mid=6 (45565) → FOUND immediately? No, checking -->

    <!-- Visual: show 3 rounds of halving -->

    <!-- Round 1 — entire array, mid at pos 6 -->
    <rect x="0" y="18" width="300" height="16" fill="#e8f5e9" rx="3" stroke="#7ab648" stroke-width="1"/>
    <text x="50"  y="30" text-anchor="middle" font-size="10" fill="#555">10101</text>
    <text x="83"  y="30" text-anchor="middle" font-size="10" fill="#555">12121</text>
    <text x="116" y="30" text-anchor="middle" font-size="10" fill="#555">15151</text>
    <text x="149" y="30" text-anchor="middle" font-size="10" fill="#555">22222</text>
    <text x="182" y="30" text-anchor="middle" font-size="10" fill="#555">32343</text>
    <text x="215" y="30" text-anchor="middle" font-size="10" fill="#555">33456</text>
    <!-- mid -->
    <rect x="231" y="19" width="36" height="14" fill="#f5a623" rx="2"/>
    <text x="249" y="30" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">45565</text>
    <text x="282" y="30" text-anchor="middle" font-size="10" fill="#555">…</text>
    <!-- mid arrow -->
    <text x="249" y="14" text-anchor="middle" font-size="9" fill="#f5a623" font-weight="700">↑ mid</text>

    <!-- Found message step 1 -->
    <rect x="0" y="40" width="300" height="18" fill="#fff8e1" rx="3"/>
    <text x="150" y="52" text-anchor="middle" font-size="10" fill="#e67e00">45565 == 45565 → ¡Encontrado en el paso 1!</text>

    <!-- Divider -->
    <line x1="0" y1="68" x2="300" y2="68" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="150" y="84" text-anchor="middle" font-size="11" fill="#888" font-weight="600">¿Y si el array tuviera 10.000 bloques?</text>

    <!-- Scale comparison box -->
    <rect x="0" y="92" width="300" height="130" fill="#f0f7f4" rx="6" stroke="#1a5c3a" stroke-width="1"/>

    <text x="150" y="110" text-anchor="middle" font-size="11" fill="#1a5c3a" font-weight="700">Índice denso — 1.000.000 registros</text>
    <text x="150" y="126" text-anchor="middle" font-size="10" fill="#555">Bloques del índice: 10.000</text>

    <!-- Binary search steps visualization -->
    <text x="12" y="146" font-size="10" fill="#1a5c3a" font-weight="600">Paso 1:</text>
    <rect x="60" y="135" width="230" height="14" fill="#c8e6c9" rx="2"/>
    <rect x="60" y="135" width="115" height="14" fill="#7ab648" rx="2"/>
    <text x="175" y="145" text-anchor="middle" font-size="9" fill="#fff">mid=5000 → mayor</text>

    <text x="12" y="166" font-size="10" fill="#1a5c3a" font-weight="600">Paso 2:</text>
    <rect x="60" y="155" width="115" height="14" fill="#c8e6c9" rx="2"/>
    <rect x="60" y="155" width="58" height="14" fill="#7ab648" rx="2"/>
    <text x="118" y="165" text-anchor="middle" font-size="9" fill="#fff">mid=2500 → menor</text>

    <text x="12" y="186" font-size="10" fill="#1a5c3a" font-weight="600">…</text>
    <text x="60" y="186" font-size="10" fill="#555">continúa dividiendo…</text>

    <text x="12" y="206" font-size="10" fill="#1a5c3a" font-weight="600">Paso 14:</text>
    <rect x="60" y="195" width="18" height="14" fill="#1a5c3a" rx="2"/>
    <text x="140" y="206" font-size="9" fill="#1a5c3a" font-weight="700">★ Encontrado — solo 14 pasos</text>

    <!-- Formula -->
    <rect x="0" y="234" width="300" height="28" fill="#1a5c3a" rx="5"/>
    <text x="150" y="252" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">⌈log₂(10.000)⌉ = 14 I/Os  vs  10.000 I/Os lineal</text>
  </g>

  <!-- Bottom note -->
  <rect x="20" y="388" width="720" height="1" fill="#dde3e0"/>

</svg>
