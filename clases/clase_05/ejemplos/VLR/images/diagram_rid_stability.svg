<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">

  <!-- Background -->
  <rect width="760" height="440" fill="#f8f9fa" rx="8"/>

  <!-- Title -->
  <text x="380" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a2e">
    Compactación Intra-Página y Estabilidad del RID
  </text>
  <text x="380" y="46" text-anchor="middle" font-size="11" fill="#555">
    Los slot_ids nunca cambian — solo se actualizan los offsets dentro del directorio
  </text>

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- BEFORE panel -->
  <!-- ══════════════════════════════════════════════════════ -->
  <text x="178" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">
    ANTES: espacio fragmentado
  </text>

  <!-- Page block BEFORE -->
  <rect x="30" y="80" width="296" height="68" fill="white" stroke="#334155" stroke-width="2" rx="4"/>

  <!-- Header -->
  <rect x="30" y="80" width="34" height="68" fill="#1e3a8a" rx="4 0 0 4"/>
  <text x="47" y="113" text-anchor="middle" font-size="8" fill="white" font-weight="bold">HDR</text>
  <text x="47" y="124" text-anchor="middle" font-size="7" fill="#93c5fd">8B</text>

  <!-- Slot 0 (Einstein - valid) -->
  <rect x="64" y="80" width="38" height="68" fill="#3b82f6" stroke="#1e40af" stroke-width="1"/>
  <text x="83" y="112" text-anchor="middle" font-size="8" fill="white" font-weight="bold">Slot 0</text>
  <text x="83" y="123" text-anchor="middle" font-size="7" fill="#dbeafe">off=215</text>
  <text x="83" y="134" text-anchor="middle" font-size="7" fill="#dbeafe">len=41</text>

  <!-- Slot 1 (Wu - DELETED) -->
  <rect x="102" y="80" width="38" height="68" fill="#dc2626" stroke="#991b1b" stroke-width="1"/>
  <text x="121" y="112" text-anchor="middle" font-size="8" fill="white" font-weight="bold">Slot 1</text>
  <text x="121" y="123" text-anchor="middle" font-size="7" fill="#fca5a5">0xFFFF</text>
  <text x="121" y="134" text-anchor="middle" font-size="7" fill="#fca5a5">DEL</text>

  <!-- Slot 2 (El Said - DELETED) -->
  <rect x="140" y="80" width="38" height="68" fill="#dc2626" stroke="#991b1b" stroke-width="1"/>
  <text x="159" y="112" text-anchor="middle" font-size="8" fill="white" font-weight="bold">Slot 2</text>
  <text x="159" y="123" text-anchor="middle" font-size="7" fill="#fca5a5">0xFFFF</text>
  <text x="159" y="134" text-anchor="middle" font-size="7" fill="#fca5a5">DEL</text>

  <!-- Slot 3 (Katz - valid) -->
  <rect x="178" y="80" width="38" height="68" fill="#3b82f6" stroke="#1e40af" stroke-width="1"/>
  <text x="197" y="112" text-anchor="middle" font-size="8" fill="white" font-weight="bold">Slot 3</text>
  <text x="197" y="123" text-anchor="middle" font-size="7" fill="#dbeafe">off=100</text>
  <text x="197" y="134" text-anchor="middle" font-size="7" fill="#dbeafe">len=40</text>

  <!-- Free space (middle) -->
  <rect x="216" y="80" width="30" height="68" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="231" y="117" text-anchor="middle" font-size="7" fill="#94a3b8">free</text>
  <text x="231" y="128" text-anchor="middle" font-size="7" fill="#94a3b8">76B</text>

  <!-- Katz record (valid) -->
  <rect x="246" y="80" width="38" height="68" fill="#86efac" stroke="#15803d" stroke-width="1"/>
  <text x="265" y="107" text-anchor="middle" font-size="8" fill="#14532d" font-weight="bold">Katz</text>
  <text x="265" y="118" text-anchor="middle" font-size="7" fill="#166534">40B</text>
  <text x="265" y="128" text-anchor="middle" font-size="7" fill="#166534">b.100</text>

  <!-- Gap after Katz (Wu's old space) -->
  <rect x="284" y="80" width="16" height="68" fill="#fee2e2" stroke="#fca5a5" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="292" y="117" text-anchor="middle" font-size="7" fill="#dc2626">gap</text>

  <!-- El Said's old space (gap) -->
  <!-- Actually in this simplified view, we show Katz + gap + Einstein -->
  <!-- The record area is: byte 100 = Katz, byte 140 = gap(El Said), byte 175 = gap(Wu), byte 215 = Einstein -->
  <!-- Simplified: show Katz gap Einstein -->

  <!-- Einstein record (valid, at the end) -->
  <rect x="300" y="80" width="26" height="68" fill="#d1fae5" stroke="#15803d" stroke-width="1" rx="0 4 4 0"/>
  <text x="313" y="107" text-anchor="middle" font-size="8" fill="#14532d" font-weight="bold">Einst.</text>
  <text x="313" y="118" text-anchor="middle" font-size="7" fill="#166534">41B</text>
  <text x="313" y="128" text-anchor="middle" font-size="7" fill="#166534">b.215</text>

  <!-- GAP labels below the page -->
  <text x="292" y="160" text-anchor="middle" font-size="8" fill="#dc2626">↑ 75B fragmentados</text>
  <text x="292" y="172" text-anchor="middle" font-size="8" fill="#dc2626">(Wu + El Said)</text>

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- COMPACT_PAGE() ARROW -->
  <!-- ══════════════════════════════════════════════════════ -->
  <line x1="345" y1="114" x2="410" y2="114" stroke="#7c3aed" stroke-width="2.5"/>
  <polygon points="408,109 420,114 408,119" fill="#7c3aed"/>
  <rect x="345" y="97" width="74" height="34" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2" rx="4"/>
  <text x="382" y="112" text-anchor="middle" font-size="9" fill="#6d28d9" font-weight="bold">compact_</text>
  <text x="382" y="124" text-anchor="middle" font-size="9" fill="#6d28d9" font-weight="bold">page(0)</text>

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- AFTER panel -->
  <!-- ══════════════════════════════════════════════════════ -->
  <text x="584" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">
    DESPUÉS: espacio consolidado
  </text>

  <!-- Page block AFTER -->
  <rect x="430" y="80" width="296" height="68" fill="white" stroke="#334155" stroke-width="2" rx="4"/>

  <!-- Header -->
  <rect x="430" y="80" width="34" height="68" fill="#1e3a8a" rx="4 0 0 4"/>
  <text x="447" y="113" text-anchor="middle" font-size="8" fill="white" font-weight="bold">HDR</text>
  <text x="447" y="124" text-anchor="middle" font-size="7" fill="#93c5fd">8B</text>

  <!-- Slot 0 (Einstein - valid, offset UPDATED) -->
  <rect x="464" y="80" width="44" height="68" fill="#3b82f6" stroke="#1e40af" stroke-width="1"/>
  <text x="486" y="104" text-anchor="middle" font-size="8" fill="white" font-weight="bold">Slot 0</text>
  <text x="486" y="116" text-anchor="middle" font-size="7" fill="#dbeafe">off=215</text>
  <text x="486" y="127" text-anchor="middle" font-size="7" fill="#dbeafe">len=41</text>
  <text x="486" y="139" text-anchor="middle" font-size="7" fill="#fbbf24">sin cambio</text>

  <!-- Slot 1 (DELETED - stays deleted) -->
  <rect x="508" y="80" width="44" height="68" fill="#dc2626" stroke="#991b1b" stroke-width="1"/>
  <text x="530" y="112" text-anchor="middle" font-size="8" fill="white" font-weight="bold">Slot 1</text>
  <text x="530" y="123" text-anchor="middle" font-size="7" fill="#fca5a5">0xFFFF</text>
  <text x="530" y="134" text-anchor="middle" font-size="7" fill="#fca5a5">DEL</text>

  <!-- Slot 2 (DELETED - stays deleted) -->
  <rect x="552" y="80" width="44" height="68" fill="#dc2626" stroke="#991b1b" stroke-width="1"/>
  <text x="574" y="112" text-anchor="middle" font-size="8" fill="white" font-weight="bold">Slot 2</text>
  <text x="574" y="123" text-anchor="middle" font-size="7" fill="#fca5a5">0xFFFF</text>
  <text x="574" y="134" text-anchor="middle" font-size="7" fill="#fca5a5">DEL</text>

  <!-- Slot 3 (Katz - valid, offset UPDATED) -->
  <rect x="596" y="80" width="44" height="68" fill="#3b82f6" stroke="#1e40af" stroke-width="1"/>
  <text x="618" y="104" text-anchor="middle" font-size="8" fill="white" font-weight="bold">Slot 3</text>
  <text x="618" y="116" text-anchor="middle" font-size="7" fill="#dbeafe">off=175</text>
  <text x="618" y="127" text-anchor="middle" font-size="7" fill="#fbbf24">actualiz.</text>
  <text x="618" y="139" text-anchor="middle" font-size="7" fill="#dbeafe">len=40</text>

  <!-- Large free space (consolidated) -->
  <rect x="640" y="80" width="44" height="68" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="662" y="108" text-anchor="middle" font-size="8" fill="#475569" font-style="italic">FREE</text>
  <text x="662" y="120" text-anchor="middle" font-size="8" fill="#94a3b8">151B</text>
  <text x="662" y="132" text-anchor="middle" font-size="7" fill="#22c55e">+75B</text>

  <!-- Katz record (moved but same slot_id) -->
  <rect x="684" y="80" width="20" height="68" fill="#86efac" stroke="#15803d" stroke-width="1"/>
  <text x="694" y="113" text-anchor="middle" font-size="7" fill="#14532d" font-weight="bold" transform="rotate(-90,694,113)">Katz 40B</text>

  <!-- Einstein record (unchanged position) -->
  <rect x="704" y="80" width="22" height="68" fill="#d1fae5" stroke="#15803d" stroke-width="1" rx="0 4 4 0"/>
  <text x="715" y="113" text-anchor="middle" font-size="7" fill="#14532d" font-weight="bold" transform="rotate(-90,715,113)">Einst. 41B</text>

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- HIGHLIGHT: what changed vs what didn't -->
  <!-- ══════════════════════════════════════════════════════ -->

  <text x="380" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a2e">
    Lo que cambia vs. lo que no cambia después de la compactación:
  </text>

  <!-- Table -->
  <rect x="60" y="205" width="640" height="26" fill="#1e3a8a" rx="3 3 0 0"/>
  <text x="200" y="222" text-anchor="middle" font-size="10" fill="white" font-weight="bold">Elemento</text>
  <text x="440" y="222" text-anchor="middle" font-size="10" fill="white" font-weight="bold">Antes</text>
  <text x="610" y="222" text-anchor="middle" font-size="10" fill="white" font-weight="bold">Después</text>

  <!-- Row 1: slot_id -->
  <rect x="60" y="231" width="640" height="24" fill="#f0fdf4"/>
  <text x="200" y="247" text-anchor="middle" font-size="10" fill="#166534" font-weight="bold">slot_id de Einstein</text>
  <text x="440" y="247" text-anchor="middle" font-size="10" fill="#166534">0</text>
  <text x="610" y="247" text-anchor="middle" font-size="10" fill="#166534">0  ← sin cambio ✓</text>

  <!-- Row 2: slot_id Katz -->
  <rect x="60" y="255" width="640" height="24" fill="#f0fdf4"/>
  <text x="200" y="271" text-anchor="middle" font-size="10" fill="#166534" font-weight="bold">slot_id de Katz</text>
  <text x="440" y="271" text-anchor="middle" font-size="10" fill="#166534">3</text>
  <text x="610" y="271" text-anchor="middle" font-size="10" fill="#166534">3  ← sin cambio ✓</text>

  <!-- Row 3: offset Einstein -->
  <rect x="60" y="279" width="640" height="24" fill="#fffbeb"/>
  <text x="200" y="295" text-anchor="middle" font-size="10" fill="#78350f" font-weight="bold">offset físico de Einstein (slot dir)</text>
  <text x="440" y="295" text-anchor="middle" font-size="10" fill="#78350f">215</text>
  <text x="610" y="295" text-anchor="middle" font-size="10" fill="#78350f">215 ← sin cambio (no se movió)</text>

  <!-- Row 4: offset Katz -->
  <rect x="60" y="303" width="640" height="24" fill="#fef2f2"/>
  <text x="200" y="319" text-anchor="middle" font-size="10" fill="#991b1b" font-weight="bold">offset físico de Katz (slot dir)</text>
  <text x="440" y="319" text-anchor="middle" font-size="10" fill="#991b1b">100</text>
  <text x="610" y="319" text-anchor="middle" font-size="10" fill="#991b1b">175 ← actualizado internamente</text>

  <!-- Row 5: free space -->
  <rect x="60" y="327" width="640" height="24" fill="#eff6ff"/>
  <text x="200" y="343" text-anchor="middle" font-size="10" fill="#1e40af" font-weight="bold">Espacio libre disponible</text>
  <text x="440" y="343" text-anchor="middle" font-size="10" fill="#1e40af">76 B (fragmentados)</text>
  <text x="610" y="343" text-anchor="middle" font-size="10" fill="#1e40af">151 B (contiguos)</text>

  <!-- ── KEY INSIGHT BOX ── -->
  <rect x="60" y="365" width="640" height="60" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5" rx="5"/>
  <text x="90" y="385" font-size="11" font-weight="bold" fill="#6d28d9">Invariante de la Slotted Page:</text>
  <text x="90" y="402" font-size="10" fill="#3b0764">
    El RID externo es (page_id, slot_id). Ambos son inmutables durante la compactación.
  </text>
  <text x="90" y="418" font-size="10" fill="#3b0764">
    Cualquier índice o cursor que almacene RID(0,3) sigue apuntando correctamente a Katz.
  </text>

</svg>
