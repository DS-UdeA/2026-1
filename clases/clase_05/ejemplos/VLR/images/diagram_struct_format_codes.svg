<svg width="100%" viewBox="0 0 680 370" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="680" height="370" fill="#f8f9fa" rx="8"/>

  <text x="340" y="24" text-anchor="middle" font-size="14" font-weight="500" fill="#1a1a2e">Códigos de tipo: espacio en disco por código</text>
  <text x="340" y="40" text-anchor="middle" font-size="12" fill="#64748b">Cada bloque coloreado = 1 byte físico en el archivo .dat</text>

  <!-- Leyenda -->
  <rect x="40"  y="52" width="14" height="14" rx="2" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
  <text x="58"  y="63" font-size="12" fill="#64748b">B — 1 byte</text>
  <rect x="168" y="52" width="14" height="14" rx="2" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="186" y="63" font-size="12" fill="#64748b">H / h — 2 bytes</text>
  <rect x="318" y="52" width="14" height="14" rx="2" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
  <text x="336" y="63" font-size="12" fill="#64748b">I — 4 bytes</text>
  <rect x="438" y="52" width="14" height="14" rx="2" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
  <text x="456" y="63" font-size="12" fill="#64748b">q — 8 bytes</text>

  <!-- Fila B -->
  <text x="62" y="91" text-anchor="middle" font-size="14" font-weight="500" fill="#1a1a2e">B</text>
  <text x="62" y="107" text-anchor="middle" font-size="12" fill="#64748b">1 byte</text>
  <rect x="100" y="78" width="38" height="38" rx="4" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
  <text x="119" y="97" text-anchor="middle" font-size="12" fill="#26215C" dominant-baseline="central">0xFF</text>
  <text x="148" y="97" font-size="12" fill="#64748b" dominant-baseline="central">← 0 a 255  ·  Java: byte</text>

  <!-- Fila H -->
  <text x="62" y="135" text-anchor="middle" font-size="14" font-weight="500" fill="#1a1a2e">H</text>
  <text x="62" y="151" text-anchor="middle" font-size="12" fill="#64748b">2 bytes</text>
  <rect x="100" y="122" width="38" height="38" rx="4" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="119" y="141" text-anchor="middle" font-size="12" fill="#04342C" dominant-baseline="central">0x00</text>
  <rect x="142" y="122" width="38" height="38" rx="4" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="161" y="141" text-anchor="middle" font-size="12" fill="#04342C" dominant-baseline="central">0xD7</text>
  <text x="190" y="141" font-size="12" fill="#64748b" dominant-baseline="central">← ej. 215 big-endian  ·  Java: short</text>

  <!-- Fila I -->
  <text x="62" y="179" text-anchor="middle" font-size="14" font-weight="500" fill="#1a1a2e">I</text>
  <text x="62" y="195" text-anchor="middle" font-size="12" fill="#64748b">4 bytes</text>
  <rect x="100" y="166" width="38" height="38" rx="4" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
  <text x="119" y="185" text-anchor="middle" font-size="12" fill="#412402" dominant-baseline="central">0x00</text>
  <rect x="142" y="166" width="38" height="38" rx="4" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
  <text x="161" y="185" text-anchor="middle" font-size="12" fill="#412402" dominant-baseline="central">0x01</text>
  <rect x="184" y="166" width="38" height="38" rx="4" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
  <text x="203" y="185" text-anchor="middle" font-size="12" fill="#412402" dominant-baseline="central">0x11</text>
  <rect x="226" y="166" width="38" height="38" rx="4" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
  <text x="245" y="185" text-anchor="middle" font-size="12" fill="#412402" dominant-baseline="central">0x70</text>
  <text x="274" y="185" font-size="12" fill="#64748b" dominant-baseline="central">← ej. 70 000  ·  Java: int</text>

  <!-- Fila q: 8 bloques 30px, gap 3px -->
  <text x="62" y="223" text-anchor="middle" font-size="14" font-weight="500" fill="#1a1a2e">q</text>
  <text x="62" y="239" text-anchor="middle" font-size="12" fill="#64748b">8 bytes</text>
  <rect x="100" y="210" width="30" height="38" rx="4" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
  <text x="115" y="229" text-anchor="middle" font-size="11" fill="#4A1B0C" dominant-baseline="central">00</text>
  <rect x="133" y="210" width="30" height="38" rx="4" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
  <text x="148" y="229" text-anchor="middle" font-size="11" fill="#4A1B0C" dominant-baseline="central">00</text>
  <rect x="166" y="210" width="30" height="38" rx="4" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
  <text x="181" y="229" text-anchor="middle" font-size="11" fill="#4A1B0C" dominant-baseline="central">00</text>
  <rect x="199" y="210" width="30" height="38" rx="4" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
  <text x="214" y="229" text-anchor="middle" font-size="11" fill="#4A1B0C" dominant-baseline="central">00</text>
  <rect x="232" y="210" width="30" height="38" rx="4" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
  <text x="247" y="229" text-anchor="middle" font-size="11" fill="#4A1B0C" dominant-baseline="central">00</text>
  <rect x="265" y="210" width="30" height="38" rx="4" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
  <text x="280" y="229" text-anchor="middle" font-size="11" fill="#4A1B0C" dominant-baseline="central">90</text>
  <rect x="298" y="210" width="30" height="38" rx="4" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
  <text x="313" y="229" text-anchor="middle" font-size="11" fill="#4A1B0C" dominant-baseline="central">F5</text>
  <rect x="331" y="210" width="30" height="38" rx="4" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
  <text x="346" y="229" text-anchor="middle" font-size="11" fill="#4A1B0C" dominant-baseline="central">60</text>
  <text x="371" y="229" font-size="12" fill="#64748b" dominant-baseline="central">← ej. 9 500 000  ·  Java: long</text>

  <line x1="40" y1="262" x2="640" y2="262" stroke="#e2e8f0" stroke-width="1"/>

  <text x="40" y="280" font-size="14" font-weight="500" fill="#1a1a2e">Encadenado:</text>
  <text x="152" y="280" font-size="12" fill="#334155" font-family="monospace">struct.pack('&gt;HHq', 215, 41, 9500000)</text>
  <text x="152" y="296" font-size="12" fill="#334155" font-family="monospace">→  H(2B) + H(2B) + q(8B)  =  12 bytes</text>

  <!-- Tira de bloques -->
  <rect x="100" y="306" width="28" height="26" rx="3" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <rect x="131" y="306" width="28" height="26" rx="3" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <rect x="162" y="306" width="28" height="26" rx="3" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <rect x="193" y="306" width="28" height="26" rx="3" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <rect x="224" y="306" width="28" height="26" rx="3" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
  <rect x="255" y="306" width="28" height="26" rx="3" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
  <rect x="286" y="306" width="28" height="26" rx="3" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
  <rect x="317" y="306" width="28" height="26" rx="3" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
  <rect x="348" y="306" width="28" height="26" rx="3" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
  <rect x="379" y="306" width="28" height="26" rx="3" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
  <rect x="410" y="306" width="28" height="26" rx="3" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
  <rect x="441" y="306" width="28" height="26" rx="3" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>

  <text x="160" y="347" text-anchor="middle" font-size="12" fill="#0F6E56">H + H  (4 bytes)</text>
  <text x="346" y="347" text-anchor="middle" font-size="12" fill="#993C1D">q  (8 bytes)</text>
</svg>
