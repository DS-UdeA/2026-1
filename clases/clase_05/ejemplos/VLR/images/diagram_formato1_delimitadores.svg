<svg width="100%" viewBox="0 0 680 160" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="680" height="160" fill="#f8f9fa" rx="8"/>

  <text x="340" y="22" text-anchor="middle" font-size="14" font-weight="500" fill="#1a1a2e">Formato 1 — almacenamiento con delimitadores</text>
  <text x="340" y="38" text-anchor="middle" font-size="12" fill="#64748b">instructor(22222, 'Einstein', 'Physics', 95000.00)  ·  31 bytes en disco</text>

  <rect x="60"  y="50" width="60"  height="50" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="90"  y="70" text-anchor="middle" font-size="13" font-weight="500" fill="#085041" dominant-baseline="central">'22222'</text>
  <text x="90"  y="88" text-anchor="middle" font-size="11" fill="#0F6E56" dominant-baseline="central">5 bytes</text>

  <rect x="120" y="50" width="14"  height="50" rx="2" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text x="127" y="75" text-anchor="middle" font-size="11" fill="#791F1F" dominant-baseline="central">$</text>

  <rect x="134" y="50" width="96"  height="50" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="182" y="70" text-anchor="middle" font-size="13" font-weight="500" fill="#085041" dominant-baseline="central">'Einstein'</text>
  <text x="182" y="88" text-anchor="middle" font-size="11" fill="#0F6E56" dominant-baseline="central">8 bytes</text>

  <rect x="230" y="50" width="14"  height="50" rx="2" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text x="237" y="75" text-anchor="middle" font-size="11" fill="#791F1F" dominant-baseline="central">$</text>

  <rect x="244" y="50" width="84"  height="50" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="286" y="70" text-anchor="middle" font-size="13" font-weight="500" fill="#085041" dominant-baseline="central">'Physics'</text>
  <text x="286" y="88" text-anchor="middle" font-size="11" fill="#0F6E56" dominant-baseline="central">7 bytes</text>

  <rect x="328" y="50" width="14"  height="50" rx="2" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text x="335" y="75" text-anchor="middle" font-size="11" fill="#791F1F" dominant-baseline="central">$</text>

  <rect x="342" y="50" width="96"  height="50" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="390" y="70" text-anchor="middle" font-size="13" font-weight="500" fill="#085041" dominant-baseline="central">'95000.00'</text>
  <text x="390" y="88" text-anchor="middle" font-size="11" fill="#0F6E56" dominant-baseline="central">8 bytes</text>

  <!-- Leyenda -->
  <rect x="460" y="56" width="14" height="14" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="478" y="67" font-size="11" fill="#64748b" dominant-baseline="central">campo</text>
  <rect x="460" y="78" width="14" height="14" rx="2" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text x="478" y="89" font-size="11" fill="#64748b" dominant-baseline="central">delimitador '$'</text>

  <!-- Byte ruler -->
  <line x1="60"  y1="102" x2="60"  y2="108" stroke="#94a3b8" stroke-width="1"/>
  <line x1="120" y1="102" x2="120" y2="108" stroke="#94a3b8" stroke-width="1"/>
  <line x1="134" y1="102" x2="134" y2="108" stroke="#94a3b8" stroke-width="1"/>
  <line x1="230" y1="102" x2="230" y2="108" stroke="#94a3b8" stroke-width="1"/>
  <line x1="244" y1="102" x2="244" y2="108" stroke="#94a3b8" stroke-width="1"/>
  <line x1="328" y1="102" x2="328" y2="108" stroke="#94a3b8" stroke-width="1"/>
  <line x1="342" y1="102" x2="342" y2="108" stroke="#94a3b8" stroke-width="1"/>
  <line x1="438" y1="102" x2="438" y2="108" stroke="#94a3b8" stroke-width="1"/>

  <text x="60"  y="122" text-anchor="middle" font-size="11" fill="#64748b">0</text>
  <text x="120" y="122" text-anchor="middle" font-size="11" fill="#64748b">5</text>
  <text x="134" y="122" text-anchor="middle" font-size="11" fill="#64748b">6</text>
  <text x="230" y="122" text-anchor="middle" font-size="11" fill="#64748b">14</text>
  <text x="244" y="122" text-anchor="middle" font-size="11" fill="#64748b">15</text>
  <text x="328" y="122" text-anchor="middle" font-size="11" fill="#64748b">22</text>
  <text x="342" y="122" text-anchor="middle" font-size="11" fill="#64748b">23</text>
  <text x="438" y="122" text-anchor="middle" font-size="11" fill="#64748b">30</text>

  <text x="340" y="146" text-anchor="middle" font-size="11" fill="#64748b">Para localizar dept_name el motor escanea desde byte 0 hasta encontrar el segundo '$'  →  acceso O(n)</text>
</svg>
