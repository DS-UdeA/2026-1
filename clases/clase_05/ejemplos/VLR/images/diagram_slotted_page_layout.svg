<svg width="100%" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="680" height="260" fill="#f8f9fa" rx="8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Regla de bytes -->
  <text x="44"  y="28" text-anchor="end"    font-size="11" fill="#64748b">byte</text>
  <text x="52"  y="28" text-anchor="middle" font-size="11" fill="#64748b">0</text>
  <text x="122" y="28" text-anchor="middle" font-size="11" fill="#64748b">8</text>
  <text x="262" y="28" text-anchor="middle" font-size="11" fill="#64748b">free_ptr</text>
  <text x="452" y="28" text-anchor="middle" font-size="11" fill="#64748b">data_ptr</text>
  <text x="630" y="28" text-anchor="middle" font-size="11" fill="#64748b">255</text>

  <line x1="52"  y1="32" x2="52"  y2="38" stroke="#94a3b8" stroke-width="1"/>
  <line x1="122" y1="32" x2="122" y2="38" stroke="#94a3b8" stroke-width="1"/>
  <line x1="262" y1="32" x2="262" y2="38" stroke="#475569" stroke-width="1.5"/>
  <line x1="452" y1="32" x2="452" y2="38" stroke="#475569" stroke-width="1.5"/>
  <line x1="630" y1="32" x2="630" y2="38" stroke="#94a3b8" stroke-width="1"/>

  <!-- HEADER -->
  <rect x="52"  y="38" width="70"  height="52" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
  <text x="87"  y="58" text-anchor="middle" font-size="13" font-weight="500" fill="#0C447C" dominant-baseline="central">HEADER</text>
  <text x="87"  y="76" text-anchor="middle" font-size="11" fill="#185FA5" dominant-baseline="central">8 bytes</text>

  <!-- SLOT DIRECTORY -->
  <rect x="122" y="38" width="140" height="52" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text x="192" y="55" text-anchor="middle" font-size="13" font-weight="500" fill="#3C3489" dominant-baseline="central">SLOT DIRECTORY</text>
  <text x="192" y="72" text-anchor="middle" font-size="11" fill="#534AB7" dominant-baseline="central">crece  →→→</text>

  <!-- FREE SPACE -->
  <rect x="262" y="38" width="190" height="52" fill="#F1EFE8" stroke="#888780" stroke-width="0.8" stroke-dasharray="5,3"/>
  <text x="357" y="64" text-anchor="middle" font-size="12" fill="#5F5E5A" dominant-baseline="central" font-style="italic">espacio libre</text>

  <!-- RECORD AREA -->
  <rect x="452" y="38" width="178" height="52" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="541" y="55" text-anchor="middle" font-size="13" font-weight="500" fill="#085041" dominant-baseline="central">RECORD AREA</text>
  <text x="541" y="72" text-anchor="middle" font-size="11" fill="#0F6E56" dominant-baseline="central">←←←  crece</text>

  <!-- Flechas de crecimiento -->
  <line x1="130" y1="96" x2="250" y2="96" stroke="#534AB7" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="622" y1="96" x2="464" y2="96" stroke="#0F6E56" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- free_ptr annotation -->
  <line x1="262" y1="90" x2="262" y2="128" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="262" y="140" text-anchor="middle" font-size="11" fill="#475569">free_ptr</text>
  <text x="262" y="153" text-anchor="middle" font-size="11" fill="#94a3b8">fin del directorio</text>

  <!-- data_ptr annotation -->
  <line x1="452" y1="90" x2="452" y2="128" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="452" y="140" text-anchor="middle" font-size="11" fill="#475569">data_ptr</text>
  <text x="452" y="153" text-anchor="middle" font-size="11" fill="#94a3b8">inicio de registros</text>

  <!-- Separador -->
  <line x1="44" y1="168" x2="636" y2="168" stroke="#e2e8f0" stroke-width="1"/>
  <text x="340" y="182" text-anchor="middle" font-size="13" font-weight="500" fill="#1a1a2e">Detalle del Page Header (8 bytes fijos)</text>

  <!-- 4 celdas del header -->
  <rect x="44"  y="190" width="148" height="46" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
  <text x="118" y="207" text-anchor="middle" font-size="13" font-weight="500" fill="#0C447C" dominant-baseline="central">num_slots</text>
  <text x="118" y="223" text-anchor="middle" font-size="11" fill="#185FA5" dominant-baseline="central">2 bytes — uint16</text>

  <rect x="192" y="190" width="148" height="46" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
  <text x="266" y="207" text-anchor="middle" font-size="13" font-weight="500" fill="#0C447C" dominant-baseline="central">free_ptr</text>
  <text x="266" y="223" text-anchor="middle" font-size="11" fill="#185FA5" dominant-baseline="central">2 bytes — uint16</text>

  <rect x="340" y="190" width="148" height="46" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
  <text x="414" y="207" text-anchor="middle" font-size="13" font-weight="500" fill="#0C447C" dominant-baseline="central">data_ptr</text>
  <text x="414" y="223" text-anchor="middle" font-size="11" fill="#185FA5" dominant-baseline="central">2 bytes — uint16</text>

  <rect x="488" y="190" width="148" height="46" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
  <text x="562" y="207" text-anchor="middle" font-size="13" font-weight="500" fill="#0C447C" dominant-baseline="central">page_id</text>
  <text x="562" y="223" text-anchor="middle" font-size="11" fill="#185FA5" dominant-baseline="central">2 bytes — uint16</text>

  <!-- Regla del header -->
  <text x="44"  y="246" text-anchor="middle" font-size="11" fill="#64748b">0</text>
  <text x="192" y="246" text-anchor="middle" font-size="11" fill="#64748b">2</text>
  <text x="340" y="246" text-anchor="middle" font-size="11" fill="#64748b">4</text>
  <text x="488" y="246" text-anchor="middle" font-size="11" fill="#64748b">6</text>
  <text x="636" y="246" text-anchor="middle" font-size="11" fill="#64748b">8</text>
  <text x="340" y="258" text-anchor="middle" font-size="11" fill="#94a3b8">offsets en bytes dentro del header</text>
</svg>
